name: cppcheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6

    - name: Install cppcheck
      shell: bash
      run: |
        # I made a PPA on launchpad where I built cppcheck 2.15 for 24.04
        sudo add-apt-repository ppa:jmarrec/ppa
        sudo apt update
        sudo apt install -y cppcheck
        cppcheck --version

    - name: Run cppcheck
      shell: bash
      run: |
          cppcheck \
            --std=c++20 \
            --enable=warning,style,information \
            --suppress=missingIncludeSystem \
            --suppress=useStlAlgorithm \
            --inline-suppr \
            --template='[{file}:{line}]:({severity}),[{id}],{message}' \
            --force -q -j $(nproc) \
            ./src 2>&1 | tee cppcheck.txt

    - name: Parse and colorize cppcheck
      shell: bash
      run: python ./ci/colorize_cppcheck_results.py

    - name: Upload cppcheck results as artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
          name: EnergyPlus-Cpp-Demo-${{ github.sha }}-cppcheck_results.txt
          path: cppcheck.txt
