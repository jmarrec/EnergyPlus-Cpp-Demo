name: clang-tidy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CC: /usr/bin/clang-18
  CXX: /usr/bin/clang++-18
  ENERGYPLUS_RELEASE_ENDPOINT: https://github.com/NatLabRockies/EnergyPlus/releases/download/v25.2.0
  EPLUS_INSTALLER_NAME: EnergyPlus-25.2.0-cf7368216c-Linux-Ubuntu24.04-x86_64
  EPLUS_INSALLER_EXT: tar.gz

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Install conan and dependencies
      shell: bash
      run: |
        python --version
        pip install conan
        conan --version
        conan profile detect --force --name default
        echo "Using apt to install ninja"
        sudo apt update
        sudo apt -y -qq install ninja-build
        echo "Conan install dependencies"
        conan install . --output-folder=./build --build=missing -c tools.cmake.cmaketoolchain:generator=Ninja -s compiler.cppstd=20 -s build_type=Release

    - name: Generate compile_commands.json
      shell: bash
      working-directory: ./build
      run: |
        set -x

        curl -L -O ${{ env.ENERGYPLUS_RELEASE_ENDPOINT }}/$EPLUS_INSTALLER_NAME.$EPLUS_INSALLER_EXT
        cmake -E tar xfz $EPLUS_INSTALLER_NAME.$EPLUS_INSALLER_EXT
        echo "ENERGYPLUS_DIR=$(pwd)/$EPLUS_INSTALLER_NAME" >> $GITHUB_ENV

        echo "Cmake"
        cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_TESTING:BOOL=ON \
              -Denergyplus_DIR=${{ env.ENERGYPLUS_DIR }} -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON \
              ../

    - name: Run Clang-tidy
      shell: bash
      working-directory: ./build
      run: |
        run-clang-tidy-18 -fix -format -extra-arg=-Wno-unknown-warning-option

        # clang-tidy will auto correct files so prepare the diff and use this as artifact
        git diff > clang_tidy.patch

        # Delete if nothhing otherwise exit 1 to indicate a failed job
        if [ ! -s clang_tidy.patch ]
        then
            rm clang_tidy.patch
            exit 0
        else
            echo "clang-format auto corrected files:"
            git diff --name-only
            echo -e "\nPlease correct these files."
          exit 1
        fi

        exit 0

    - name: Upload clang-tidy patch as artifact
      if: ${{ failure() }}
      uses: actions/upload-artifact@v6
      with:
          name: EnergyPlus-Cpp-Demo-${{ github.sha }}-clang_tidy.patch
          path: clang_tidy.patch
